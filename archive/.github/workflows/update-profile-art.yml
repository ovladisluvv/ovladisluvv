name: Update profile art

on:
  schedule:
    # Every day at 03:01 UTC.
    - cron: "1 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Fetch contributions and render heatmap
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py

      - name: Commit generated files
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- data/contributions.json contrib-heatmap.svg)" ]]; then
            echo "Generated files have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json contrib-heatmap.svg
          git commit -m "chore: update contribution graph"
          git push
